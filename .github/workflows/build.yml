name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Test screen geometry
        run: bash scripts/test-screen-geometry.sh

      - name: Test link filter
        run: bash scripts/test-safe-links.sh

      - name: Test chat parsing
        run: bash scripts/test-chat-parsing.sh

      - name: Test plan gauge
        run: bash scripts/test-plan-gauge.sh

      - name: Test ask question
        run: bash scripts/test-ask-question.sh

      - name: Test conversation inbox and chat safety
        run: bash scripts/test-conversation-inbox.sh

      - name: Test Claude desktop capture
        run: bash scripts/test-claude-desktop.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test browser connector
        run: |
          node --test tests/browser-*.test.mjs
          python3 tests/test_native_bridge.py

      - name: Build
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
